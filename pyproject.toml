[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ai"
version = "0.1.0"
description = "Fit AI Core: telemetry gateway for a Honda Fit head unit (PoC 02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "anyio>=4",
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running OCTAVE on 127.0.0.1 (skipped automatically when unreachable)",
]
