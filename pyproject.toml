[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-ai"
version = "0.1.0"
description = "Fit AI Core: telemetry gateway and local AI Engine for a Honda Fit head unit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local speech recognition (P9.1). Optional: the Core runs without it and answers 503 stt_unavailable on the voice route.
# Exact pin: the version evaluated in docs/poc-09-01-local-stt.md. The model is NOT a package and is never downloaded by the Core.
stt = [
    "faster-whisper==1.2.1",
    "numpy>=2",
]
dev = [
    "anyio>=4",
    "numpy>=2",  # the speech provider tests decode PCM with it (the engine itself stays optional)
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fit_ai.ai" = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs a running OCTAVE on 127.0.0.1 (skipped automatically when unreachable)",
    "integration_llm: needs a running local Ollama with the configured models (skipped automatically when unavailable)",
    "integration_stt: needs the speech engine, its model and FIT_AI_STT_TEST_WAV (skipped automatically when not ready)",
    "needs_sdk: needs the OCTAVE SDK, which is outside this repository (skipped automatically when it is not installed)",
]
