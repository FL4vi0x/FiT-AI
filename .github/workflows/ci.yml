name: CI

# Hermetic checks only: no secrets, no network services, no model, no OCTAVE, no vehicle. Tests that need the OCTAVE SDK (it is not part of
# this repository), a running OCTAVE or a running Ollama skip themselves with an explicit reason. Browser end-to-end tests (e2e/*.mjs) need
# a real browser with WebGL and are run on the developer's machine, not here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: "Install (exact lockfile, lifecycle scripts off, see ui/.npmrc)"
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

      # A rights-restricted preview model may exist on a developer machine and is served by the dev server only. A production bundle must
      # never contain it, its credit text or its local route.
      - name: Production bundle contains no local preview model
        shell: bash
        run: |
          if grep -rlE "Gran Turismo|__local_vehicle|candidate_C|Asadawut|kusuma844|DIREITOS" dist; then
            echo "a local preview asset leaked into the production bundle" >&2
            exit 1
          fi
          if [ -n "$(find dist \( -iname '*.glb' -o -iname '*.fbx' \))" ]; then
            echo "a 3D model file is in the production bundle" >&2
            exit 1
          fi

      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

  backend:
    name: Backend (Python 3.14, windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q -m "not integration_llm"

      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
